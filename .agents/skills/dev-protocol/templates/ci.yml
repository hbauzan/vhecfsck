# =============================================================================
# DEV AGENT PROTOCOL — CI template
# -----------------------------------------------------------------------------
# NOTE ON PORTABILITY: this file is GitHub Actions specific — the only template
# in the pack that is. The pattern ports to any runner, and it is only three
# things: (1) run the same `make verify` a developer runs, on a matrix of
# supported Python versions; (2) an advisory job for the NEXT Python version
# that cannot block a merge; (3) a scheduled job that installs the LATEST
# provider SDKs to catch upstream drift before it lands on you.
#
# Usage in a new app:
#   1. Copy to `.github/workflows/ci.yml`.
#   2. Set the Python versions and the SDK list at the bottom.
#
# CI runs the same gate as the developer. If CI needs its own bespoke command
# sequence, the gate is not really the gate. See dev-protocol/guardrails.md §1.
# =============================================================================

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # Monday, upstream drift check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev
      - name: make verify
        run: make verify

  # Ecosystem readiness is visible without blocking merges.
  next-python:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: uv sync --all-extras --dev
      - run: make verify

  # Provider SDKs move fast and break semantics quietly. Find out on a Monday,
  # not during a release. Enforces guardrail 6 (never code against a remembered API).
  sdk-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --dev
      - name: upgrade provider SDKs to latest
        run: uv pip install --upgrade openai anthropic transformers
      - name: report installed versions
        run: uv pip list
      - run: make verify-full
