# =============================================================================
# DEV AGENT PROTOCOL — pre-commit base template (Python / uv)
# -----------------------------------------------------------------------------
# Usage in a new app:
#   1. Copy this file to the workspace ROOT as `.pre-commit-config.yaml`.
#   2. Install the git hook once:   uv run pre-commit install
#   3. Smoke-test the whole repo:   uv run pre-commit run --all-files
#
# Pin the `rev:` tags to the latest releases when you adopt this in a repo,
# then let `pre-commit autoupdate` keep them current. Versions below are
# conservative defaults, not gospel — see dev-protocol/git-workflow.md §2.
# =============================================================================

repos:
  # --- General hygiene -------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key        # blocks committed private keys

  # --- Lint + Format (ruff replaces black + flake8 + isort) ------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff                      # lint
        args: ["--fix"]
      - id: ruff-format               # format

  # --- Secret scanning (enforces "no keys in git" — SKILL.md §3.2) -----------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Local guards ----------------------------------------------------------
  - repo: local
    hooks:
      - id: block-dotenv
        name: block committing .env files
        entry: "Refusing to commit a .env file. Keep secrets out of git; commit .env.example instead."
        language: fail
        files: '(^|/)\.env(\..+)?$'
        # Allow the documented example file through:
        exclude: '(^|/)\.env\.example$'

      # Static guards — the same commands `make verify` runs under `guards`.
      # Fast, and they protect the invariants that matter most, so they belong
      # on the commit path. See dev-protocol/guardrails.md §5.
      - id: provider-seam
        name: provider SDKs stay inside the adapter layer
        entry: python scripts/check_provider_seam.py
        language: system
        types: [python]
        pass_filenames: false

      # Generated mode only. Drop this hook if MODE=opt-out (this product does).
      - id: agents-md-sync
        name: root AGENTS.md matches the skill
        entry: python scripts/sync_agents_md.py --check
        language: system
        pass_filenames: false
        files: '^(AGENTS\.md|AGENTS\.overlay\.md|\.agents/skills/dev-protocol/(guardrails|git-workflow)\.md)$'

# --- Deliberately NOT here: mypy and pytest ----------------------------------
# Not because they are optional — they are in `make verify` and in CI. The
# reason is behavioural: a hook slow enough to be annoying gets bypassed with
# `--no-verify`, and a bypassed hook protects nothing. Keep the commit path
# fast so nobody learns the habit of skipping it.
#
# If you want the type check available locally, wire it as a manual stage:
#   uv run pre-commit run --hook-stage manual mypy
#
#  - repo: https://github.com/pre-commit/mirrors-mypy
#    rev: v1.13.0
#    hooks:
#      - id: mypy
#        stages: [manual]
#        additional_dependencies: []   # add type stubs your project needs
