[project]
name = "vhecfsck"
version = "0.1.0.dev0"
description = "Topological audit and health diagnostics for vector indexes."
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "vhecfsck contributors" }]
keywords = ["vector", "hnsw", "ivf", "audit", "fsck", "embeddings"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
lancedb = []
qdrant = []
postgres = []
server = []
dev = []
all = []

[project.scripts]
vhecfsck = "vhecfsck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vhecfsck"]

[tool.hatch.build.targets.sdist]
only-include = [
    "vhecfsck",
    "tests",
    "CHANGELOG.md",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
