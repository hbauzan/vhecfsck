[project]
name = "vhecfsck"
version = "0.1.0.dev0"
description = "Topological audit and health diagnostics for vector indexes."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "hbauzan" }]
keywords = ["vector", "hnsw", "ivf", "audit", "fsck", "embeddings"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/hbauzan/vhecfsck"
Repository = "https://github.com/hbauzan/vhecfsck"
Issues = "https://github.com/hbauzan/vhecfsck/issues"
Changelog = "https://github.com/hbauzan/vhecfsck/blob/main/CHANGELOG.md"

[project.optional-dependencies]
lancedb = []
qdrant = []
postgres = []
server = []
dev = []
all = []

[project.scripts]
vhecfsck = "vhecfsck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vhecfsck"]

[tool.hatch.build.targets.sdist]
only-include = [
    "vhecfsck",
    "tests",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "import-linter>=2.14",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m",
    "not slow and not integration and not perf",
]
markers = [
    "slow: long-running tests excluded from the default run",
    "integration: real engines via testcontainers; excluded from the default run",
    "perf: benchmark budgets (nightly); excluded from the default run",
    "requires_docker: needs a working Docker daemon",
    "requires_lancedb: needs the lancedb optional extra",
    "requires_qdrant: needs the qdrant optional extra",
    "requires_postgres: needs Postgres / pgvector",
]

[tool.coverage.run]
source = ["vhecfsck"]
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["vhecfsck", "tests"]
extend-exclude = [
    ".agents",
    ".claude",
    ".cursor",
    "roadmap",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "ARG",
    "PTH",
    "RUF",
    "ANN",
    "D",
]

[tool.ruff.lint.per-file-ignores]
# ANN + D are required only in core/ and models/ (ticket P0-02).
"tests/**" = ["ANN", "D"]
"vhecfsck/__init__.py" = ["ANN", "D"]
"vhecfsck/__main__.py" = ["ANN", "D"]
"vhecfsck/cli.py" = ["ANN", "D", "A002", "UP042"]
"vhecfsck/config.py" = ["ANN", "D"]
"vhecfsck/errors.py" = ["ANN", "D"]
"vhecfsck/logging.py" = ["ANN", "D", "A005"]
"vhecfsck/adapters/**" = ["ANN", "D"]
"vhecfsck/report/**" = ["ANN", "D"]
"vhecfsck/server/**" = ["ANN", "D"]
# Copied skill templates; product-owned polish lands with later guard tickets.
"scripts/**" = ["ANN", "D", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["vhecfsck"]
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
disallow_any_generics = true
# Package default is non-strict; core/models/adapters opt into strict below.
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "vhecfsck.core",
    "vhecfsck.core.*",
    "vhecfsck.models",
    "vhecfsck.models.*",
    "vhecfsck.adapters",
    "vhecfsck.adapters.*",
    "vhecfsck.synthetic",
    "vhecfsck.synthetic.*",
]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# Tests are checked leniently: allow untyped defs and incomplete annotations.
allow_untyped_defs = true
allow_incomplete_defs = true
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["vhecfsck.server", "vhecfsck.server.*"]
disallow_untyped_decorators = false
