# =============================================================================
# Linux verification matrix.
# -----------------------------------------------------------------------------
# This workflow was disabled on 2026-08-30 with the reason "runners are billed on
# this private repo". That premise no longer holds: the repository is public, and
# standard GitHub-hosted runners are free in public repositories — no billed
# minutes and no draw against the account's monthly quota.
#
# Two things are still billed in a public repository, so do not introduce them
# without a reason:
#   * larger runners (8+ vCPU) — always charged, quota never applies;
#   * artifact storage — 500 MB shared with Packages, hence retention-days below.
#
# macOS is intentionally not in the matrix. It is not a cost decision: the
# primary development machine is macOS/arm64 and already runs `make verify` on
# every ticket, so a macos-latest leg would re-measure what the local gate
# covers. Linux x Python 3.11/3.12/3.13 is the gap this workflow closes.
#
# The sync line is load-bearing. `uv sync --group dev` alone is NOT enough:
#   * tests/integration/test_lancedb_*.py import pyarrow at module level, and
#     pytest imports a module to collect it before markers deselect it, so the
#     lancedb extra is required even though those tests never run here
#     (lessons 50 and 59);
#   * tests/unit/test_docs_generation.py shells out to `mkdocs build --strict`
#     with no skip guard, so the docs group is required too.
# Never `--all-extras`, and never add `--extra qdrant` / `--extra postgres` to
# this job: PostgresAdapter registers pgvector whenever it is importable and
# turns the contract suite red (lesson 50).
# =============================================================================

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing @vN major tags at v8 (immutable full tags only).
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        # Lean base + declared groups — never --all-extras (ADR-0002 / P0-15).
        # See the header for why docs and lancedb are not optional here.
        run: uv sync --group dev --group docs --extra lancedb
      - name: make verify
        run: make verify
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ubuntu-${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
          if-no-files-found: ignore
          retention-days: 7

