name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vhecfsck
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync dependencies
        run: uv sync --group dev --extra lancedb

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test built wheel in clean environment
        run: |
          WHEEL=$(ls dist/*.whl | head -n 1)
          set +e
          uvx --from "$WHEEL" vhecfsck demo
          ec=$?
          set -e
          # Default demo is tombstoned → FAIL (2). 0–3 are completed verdicts.
          # 4 = usage, 70 = internal; those fail the job.
          case "$ec" in
            0|1|2|3) echo "smoke ok: demo exit $ec" ;;
            *) echo "smoke failed: demo exit $ec" >&2; exit "$ec" ;;
          esac

      - name: Publish package distributions to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
